[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aic390"
version = "0.1.0"
description = "AIC 390 Prompt Engineering team project"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.60",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Heavy packages stay optional so CI installs only ".[dev]".
rag = ["bm25s>=0.2", "sentence-transformers>=3.0"]
demo = ["streamlit>=1.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
